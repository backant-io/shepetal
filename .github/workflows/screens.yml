# The screenshot harness (Tests/ShepetalTests/ScreenshotTests.swift): the Hub, the meeting windows and the shepetal
# UI Gallery drawn offscreen in Light and Dark, uploaded as the "screens" artifact. The app is never launched and no
# window goes on screen. No secrets: the account is read from a temp SHEPETAL_HOME and a test Keychain service.
name: Screens
on:
  pull_request:
    paths:
      - "Sources/Shepetal/**"
      - "design/ui/**"
      - "Tests/ShepetalTests/ScreenshotTests.swift"
      - ".github/workflows/screens.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  screens:
    # As ci.yml: macos-26 (arm64) with Xcode 26.3 and Swift 6.2.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: swiftpm-screens-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-
      - run: swift --version
      - name: Draw the screens
        run: |
          out="$RUNNER_TEMP/screens"
          mkdir -p "$out"
          SHEPETAL_HOME="$(mktemp -d)" SHEPETAL_KEYCHAIN_SERVICE=io.backant.shepetal.test.screenshots \
          SHEPETAL_SCREENSHOTS="$out" swift test --filter "ShepetalTests\..*ScreenshotTests"
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: ${{ runner.temp }}/screens/*.png
          if-no-files-found: error
