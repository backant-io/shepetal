# The login end to end for web/ (web/e2e/run.mjs): the built Worker on wrangler dev with a local D1,
# a test Google session, a fake Stripe API and a signed webhook. It needs no secrets.
name: web e2e
on:
  pull_request:
    paths: ["web/**", ".github/workflows/web-e2e.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-e2e.yml"]
permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run e2e
