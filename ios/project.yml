name: Shepetal
options:
  bundleIdPrefix: io.backant.shepetal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.17.7
targets:
  ShepetalSessionCore:
    type: framework
    platform: iOS
    sources: [Core]
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.backant.shepetal.core

  Shepetal:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.backant.shepetal
    dependencies:
      - target: ShepetalSessionCore
      - target: ShepetalKeyboard
      - target: ShepetalWidget
      - package: FluidAudio
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Shepetal
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Shepetal records your voice and transcribes it on this iPhone. Audio never leaves the device.
        CFBundleURLTypes:
          - CFBundleURLName: io.backant.shepetal
            CFBundleURLSchemes: [shepetal]
    entitlements:
      path: App/Shepetal.entitlements
      properties:
        com.apple.security.application-groups: [group.io.backant.shepetal]

  ShepetalKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.backant.shepetal.keyboard
    dependencies:
      - target: ShepetalSessionCore
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Shepetal
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            RequestsOpenAccess: true
            PrimaryLanguage: en-US
            IsASCIICapable: false
            PrefersRightToLeft: false
    entitlements:
      path: Keyboard/ShepetalKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.io.backant.shepetal]

  ShepetalWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.backant.shepetal.widget
    dependencies:
      - target: ShepetalSessionCore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Shepetal
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ShepetalSessionCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ShepetalSessionCore

schemes:
  Shepetal:
    build:
      targets:
        Shepetal: all
        ShepetalSessionCoreTests: [test]
    test:
      targets: [ShepetalSessionCoreTests]
