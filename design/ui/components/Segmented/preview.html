<!-- @dsCard group="Forms" height=120 subtitle="Appearance and key mode" -->
<div class="sh-root" style="padding:24px;min-height:100%;">

<div style="display:grid;gap:16px;justify-items:start">
  <fieldset class="sh-seg"><legend style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Appearance</legend>
    <label><input type="radio" name="ap" checked><span>System</span></label>
    <label><input type="radio" name="ap"><span>Concrete</span></label>
    <label><input type="radio" name="ap"><span>Night</span></label>
  </fieldset>
  <fieldset class="sh-seg"><legend style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Key mode</legend>
    <label><input type="radio" name="km"><span>Hold</span></label>
    <label><input type="radio" name="km" checked><span>Hold or double-tap</span></label>
  </fieldset>
</div>

</div>
