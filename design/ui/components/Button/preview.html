<div class="sh-root" style="padding:24px;min-height:100%;">

<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start">
  <a class="sh-btn sh-btn--primary sh-btn--xl" href="#try">Try 30 days free</a>
  <button class="sh-btn sh-btn--primary" type="button">Continue</button>
  <button class="sh-btn" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Show in Finder</button>
  <button class="sh-btn sh-btn--quiet" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>Copy text</button>
  <button class="sh-btn sh-btn--danger" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete recording</button>
  <button class="sh-btn sh-btn--sm" type="button">Not now</button>
  <button class="sh-btn" type="button" disabled>Re-transcribe</button>
</div>
<p class="sh-label-mono" style="margin:16px 0 0">Press a keycap: it goes down by its travel.</p>

</div>
