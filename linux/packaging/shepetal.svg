<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>shepetal: shushing face</title>
  <defs>
    <radialGradient id="face" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFE36E"/>
      <stop offset="0.6" stop-color="#FFCC33"/>
      <stop offset="1" stop-color="#F2A93B"/>
    </radialGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F9B93A"/>
      <stop offset="1" stop-color="#E8962A"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="60" r="56" fill="url(#face)"/>
  <!-- raised eyebrows -->
  <path d="M30 34 Q40 25 51 31" fill="none" stroke="#7A4A12" stroke-width="4" stroke-linecap="round"/>
  <path d="M77 31 Q88 25 98 34" fill="none" stroke="#7A4A12" stroke-width="4" stroke-linecap="round"/>
  <!-- wide eyes looking aside -->
  <ellipse cx="44" cy="50" rx="8" ry="11" fill="#FFFFFF"/>
  <ellipse cx="84" cy="50" rx="8" ry="11" fill="#FFFFFF"/>
  <ellipse cx="47" cy="51" rx="5" ry="7" fill="#3B2410"/>
  <ellipse cx="87" cy="51" rx="5" ry="7" fill="#3B2410"/>
  <circle cx="48.5" cy="48" r="1.8" fill="#FFFFFF"/>
  <circle cx="88.5" cy="48" r="1.8" fill="#FFFFFF"/>
  <!-- pursed lips behind the finger -->
  <ellipse cx="64" cy="86" rx="11" ry="7" fill="#B5531E"/>
  <!-- hand: fist below the chin, index finger up over the lips -->
  <path d="M38 108 Q38 96 50 96 L78 96 Q90 96 90 108 L90 116 Q90 127 78 127 L50 127 Q38 127 38 116 Z"
        fill="url(#hand)" stroke="#C97A16" stroke-width="2"/>
  <path d="M47 104 L81 104 M47 112 L81 112" stroke="#C97A16" stroke-width="2" stroke-linecap="round"/>
  <rect x="57" y="70" width="14" height="34" rx="7" fill="url(#hand)" stroke="#C97A16" stroke-width="2"/>
  <path d="M60 75 Q64 72 68 75" fill="none" stroke="#FFF2C2" stroke-width="2" stroke-linecap="round"/>
</svg>
