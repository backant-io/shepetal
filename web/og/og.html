<!doctype html>
<!-- The link preview (public/og.jpg), 1200 x 630. Render it headless and save it as JPEG:
     chrome --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=og.png file://.../web/og/og.html
     sips -s format jpeg -s formatOptions 86 og.png --out ../public/og.jpg
     The brand keeps the price and the steps off previews. The right half is the product moment: the
     indicator writing (blue ring) and a spoken prompt landed in a terminal, labelled as an illustration. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'shepetal Serif'; src: url('../src/app/(site)/fonts/shepetal-serif.woff2') format('woff2'); font-weight: 300 440; }
  @font-face { font-family: 'shepetal Sans'; src: url('../src/app/(site)/fonts/shepetal-sans.woff2') format('woff2'); font-weight: 400 700; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(90% 120% at 70% 110%, #8A2D57 0%, #5E1C3A 38%, #2A0F1D 72%, #1C0A13 100%);
    color: #FAEEE8;
    font-family: 'shepetal Sans', sans-serif;
  }
  .copy { position: absolute; left: 80px; top: 84px; width: 600px; }
  .mark { display: block; width: 236px; height: auto; }
  h1 { margin-top: 160px; font-family: 'shepetal Serif', serif; font-weight: 340; font-size: 58px; line-height: 1.06; text-wrap: balance; letter-spacing: -0.012em; }
  p.key { margin-top: 28px; font-size: 22px; line-height: 1.45; color: rgb(250 238 232 / 0.8); }
  .scene { position: absolute; right: 56px; top: 112px; width: 440px; height: 406px; border-radius: 22px; overflow: hidden;
    background: url('../public/brand/imagery/dusk-air-1600.webp') center 70% / cover; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.08), 0 40px 80px -24px rgb(0 0 0 / 0.7); }
  .illus { position: absolute; top: 12px; right: 12px; font-size: 13px; font-weight: 520; padding: 3px 9px; border-radius: 7px; color: rgb(255 249 246 / 0.92); background: rgb(28 10 19 / 0.45); }
  .win { position: absolute; left: 34px; right: 34px; top: 58px; border-radius: 12px; overflow: hidden; background: #201b1f; color: #ece7ea;
    box-shadow: 0 0 0 0.5px rgb(255 255 255 / 0.12), 0 24px 50px -14px rgb(0 0 0 / 0.6); font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; }
  .bar { height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 13px; background: #2b252a; border-bottom: 1px solid rgb(255 255 255 / 0.08); font-size: 13px; font-weight: 600; color: #a8a5ab; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: rgb(236 231 234 / 0.18); }
  .bar span { flex: 1; text-align: center; margin-right: 50px; }
  .term { padding: 16px 18px 22px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 15px; line-height: 1.65; }
  .dim { color: #a8a5ab; }
  .line { display: flex; gap: 10px; margin-top: 6px; }
  .ps { color: #E6ABB8; }
  .ind { position: absolute; left: 12px; bottom: 12px; width: 34px; height: 34px; border-radius: 50%; border: 3.5px solid #0A84FF; display: grid; place-items: center;
    box-shadow: 0 0 0 6px rgb(10 132 255 / 0.22); }
  .ind img { width: 24px; height: 24px; display: block; }
</style>
</head>
<body>
  <div class="copy">
    <img class="mark" src="../public/brand/shepetal-wordmark-on-dark.svg" alt="shepetal">
    <h1>Instant dictation that stays on your Mac.</h1>
    <p class="key">Press one key. Your words appear wherever you speak.</p>
  </div>
  <div class="scene">
    <div class="win">
      <div class="bar"><i></i><i></i><i></i><span>~/shop</span></div>
      <div class="term">
        <p class="dim">~/shop on main</p>
        <p class="dim">Ready. Describe the change.</p>
        <p class="line"><span class="ps">›</span><span>Add a retry to the upload in upload.ts. Try three times with a short pause, and keep the tests passing.</span></p>
      </div>
    </div>
    <span class="ind"><img src="../public/brand/emoji/emoji_u1f92b.svg" alt=""></span>
    <span class="illus">Illustration</span>
  </div>
</body>
</html>
