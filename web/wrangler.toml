name = "shepetal-web"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

# workers.dev only for now. The shepetal.backant.io custom domain is added at launch.
workers_dev = true
# Go-live: uncomment the next line, then npm run deploy.
routes = [{ pattern = "shepetal.backant.io", custom_domain = true }]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "shepetal"
database_id = "bd45470f-27b2-4564-aa94-850856413b3e"
migrations_dir = "migrations"

[vars]
NEXTAUTH_URL = "https://shepetal.backant.io"
AUTH_URL = "https://shepetal.backant.io"
# Prices: found at runtime by lookup_key (shepetal_lifetime $23.99 once, shepetal_monthly $0.99 a month),
# and the Billing Portal by metadata app=shepetal, so test and live need no IDs here.
# scripts/stripe-setup.mjs creates them. STRIPE_PRICE_LIFETIME, STRIPE_PRICE_MONTHLY and
# STRIPE_PORTAL_CONFIG override the lookups if ever needed.

# Secrets: wrangler secret put AUTH_SECRET
#          wrangler secret put GOOGLE_CLIENT_ID
#          wrangler secret put GOOGLE_CLIENT_SECRET
#          wrangler secret put STRIPE_SECRET_KEY
#          wrangler secret put STRIPE_WEBHOOK_SECRET
# For local runs, put the same names in .dev.vars (see README.md).

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
