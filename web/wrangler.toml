name = "shepetal-web"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

workers_dev = true
# The Custom Domain. Its pattern must equal SHEPETAL_DOMAIN below (src/lib/site.test.ts checks it). The first
# `npm run deploy` with this line attaches the domain: a GO step (GO-LIVE.md).
routes = [{ pattern = "shepetal.app", custom_domain = true }]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "shepetal"
database_id = "bd45470f-27b2-4564-aa94-850856413b3e"
migrations_dir = "migrations"

[vars]
# shepetal's own domain: the ONE place it is set (src/lib/site.ts). Auth callbacks (AUTH_URL is derived from it),
# Stripe success, cancel, portal and webhook URLs, OG, sitemap, canonical and /appcast.xml all follow it.
SHEPETAL_DOMAIN = "shepetal.app"
# Prices: found at runtime by lookup_key (shepetal_lifetime $23.99 once, shepetal_monthly $0.99 a month),
# and the Billing Portal by metadata app=shepetal, so test and live need no IDs here.
# scripts/stripe-setup.mjs creates them. STRIPE_PRICE_LIFETIME, STRIPE_PRICE_MONTHLY and
# STRIPE_PORTAL_CONFIG override the lookups if ever needed.

# Secrets: wrangler secret put AUTH_SECRET
#          wrangler secret put GOOGLE_CLIENT_ID
#          wrangler secret put GOOGLE_CLIENT_SECRET
#          wrangler secret put STRIPE_SECRET_KEY
#          wrangler secret put STRIPE_WEBHOOK_SECRET
# For local runs, put the same names in .dev.vars (see README.md).

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
